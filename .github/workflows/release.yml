name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `changeset publish` tags each package it publishes, and the action turns those tags
          # into GitHub releases. Changesets reads the existing tags to know what it has already
          # released, which a shallow clone does not have.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Version or publish
        # v2, because v1 learned what was published by reading `New tag:` lines in the publish
        # log, and @changesets/cli 3 no longer prints them. v1 then decided nothing had been
        # published, so npm got every package while no tag was pushed and no GitHub release was
        # made. v2 reads the list the CLI writes to CHANGESETS_OUTPUT instead, and pushes the
        # tags and creates the releases through the GitHub API with the default token.
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance only works from CI and only for public repositories.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
